name: WKN-Radar aktualisieren

# Läuft NICHT automatisch/zeitgesteuert -- nur wenn du es manuell startest:
# Repo → Tab "Actions" → "WKN-Radar aktualisieren" → "Run workflow".
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Reddit-Erwaehnungen sammeln
        working-directory: scripts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python collect.py

      - name: Wochendaten aggregieren
        working-directory: scripts
        run: python aggregate.py

      - name: Dashboard bauen
        working-directory: scripts
        run: python render_dashboard.py

      - name: Ergebnisse committen
        run: |
          git config user.name "wkn-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mentions.jsonl data/seen_ids.json data/weekly_data.json docs/index.html
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Manuelles Update: $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi
